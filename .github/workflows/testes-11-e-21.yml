name: API Transações Testes CI

on:
  push:
  pull_request:

jobs:
  test-java-21:
    runs-on: ubuntu-latest
    name: Test with Java 21
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PORT: ${{ secrets.PORT }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Allure Commandline
      run: |
        sudo wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz -O /tmp/allure.tgz
        sudo tar -zxvf /tmp/allure.tgz -C /opt/
        sudo ln -s /opt/allure-2.29.0/bin/allure /usr/bin/allure
        allure --version

    - name: Install banco-api dependencies
      run: npm install
      working-directory: ./banco-api

    - name: Start banco-api server and capture logs
      run: |
        npm run rest-api > ../banco-api.log 2>&1 &
      working-directory: ./banco-api

    - name: Wait for server to start
      run: sleep 60 # Waits 60 seconds

    - name: Display banco-api logs
      run: |
        echo "Displaying banco-api.log:"
        cat banco-api.log || echo "banco-api.log not found or empty"
      # Ensure this step runs even if previous steps fail, to capture logs
      if: always()

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test with Maven (Java 21)
      run: mvn -B clean package test --file pom.xml

    - name: Generate Allure Report
      if: always() # Ensure this runs even if tests fail
      run: allure generate allure-results --clean -o allure-report

    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-java-21
        path: allure-report/
        retention-days: 30

    - name: Upload Test Results (Surefire)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports-java-21
        path: target/surefire-reports/
        retention-days: 30