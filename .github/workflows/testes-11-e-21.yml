name: APICieloTransaçõesTestes

on:
  push:
  pull_request:

jobs:
  test-java-11:
    runs-on: ubuntu-latest
    name: Test with Java 11
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PORT: ${{ secrets.PORT }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install banco-api dependencies
      run: npm install
      working-directory: ./banco-api

    - name: Start banco-api server
      run: npm run rest-api &
      working-directory: ./banco-api

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test with Maven (Java 11)
      run: mvn -B clean package test -Dmaven.compiler.source=11 -Dmaven.compiler.target=11 --file pom.xml

    - name: Upload Test Results (Java 11)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-java-11
        path: target/surefire-reports/
        retention-days: 30

  test-java-21:
    runs-on: ubuntu-latest
    name: Test with Java 21
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PORT: ${{ secrets.PORT }} # Ensure PORT is also available here, maybe a different one if needed

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install banco-api dependencies
      run: npm install
      working-directory: ./banco-api

    - name: Start banco-api server
      # If running both jobs in parallel and they use the same port for banco-api, this could be an issue.
      # Consider using different ports or ensuring banco-api can handle concurrent requests if they share the instance.
      # For simplicity, this example assumes they might run sequentially or the server handles it.
      run: npm run rest-api &
      working-directory: ./banco-api

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test with Maven (Java 21)
      # No need to specify source/target if pom.xml is set for 21 or if this is the default for the JDK
      run: mvn -B clean package test --file pom.xml

    - name: Upload Test Results (Java 21)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-java-21
        path: target/surefire-reports/
        retention-days: 30