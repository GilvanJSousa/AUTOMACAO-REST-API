name: API Transações Testes CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-java-21:
    runs-on: ubuntu-latest
    name: Test with Java 21
    
    env:
      MONGO_URI: mongodb+srv://gillvanjs:KNAqSlJj0n6mawLV@cluster0.yia8ilv.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0
      JWT_SECRET: KNAqSlJj0n6mawLV
      PORT: 3000

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Install banco-api dependencies
      run: npm ci
      working-directory: ./banco-api

    - name: Start banco-api server
      run: |
        npm run rest-api > ../banco-api.log 2>&1 &
        echo "Server started with PID: $!"
      working-directory: ./banco-api

    - name: Wait for server to start
      run: |
        echo "Waiting for server to start..."
        timeout 120 bash -c 'until curl -f http://localhost:3000/health || curl -f http://localhost:3000/; do sleep 5; done'
        echo "Server is ready!"

    - name: Display server logs
      run: |
        echo "=== Server Logs ==="
        tail -50 banco-api.log || echo "No logs available"
      if: always()

    - name: Run tests with Maven
      run: |
        mvn -B clean test \
          -Dcucumber.filter.tags="@all" \
          -Dallure.results.directory=target/allure-results

    - name: Generate Allure Report
      if: always()
      run: |
        mvn allure:report
        echo "Allure report generated successfully"

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-java-21
        path: |
          target/surefire-reports/
          target/allure-results/
          target/site/allure-maven-plugin/
        retention-days: 30

    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-java-21
        path: target/site/allure-maven-plugin/
        retention-days: 30

    - name: Test Summary
      if: always()
      run: |
        echo "=== Test Execution Summary ==="
        echo "Java Version: $(java -version 2>&1 | head -1)"
        echo "Maven Version: $(mvn -version | head -1)"
        echo "Test Results: target/surefire-reports/"
        echo "Allure Report: target/site/allure-maven-plugin/"
